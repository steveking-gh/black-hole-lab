[package]
name = "black-hole-lab"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# The geometry core is a crate of its own so that the boundary is enforced rather than intended:
# it cannot reach into the app, and `cargo doc` renders it as the library it is. Both are default
# members so that a bare `cargo test` still runs every test there is.
[workspace]
members = [".", "crates/kerr-equatorial", "crates/readout"]
default-members = [".", "crates/kerr-equatorial", "crates/readout"]

[dependencies]
kerr-equatorial = { path = "crates/kerr-equatorial" }
readout = { path = "crates/readout" }
eframe = "0.36.2"
egui = "0.36.2"
# gzip for the save format. Already in the tree behind eframe's image decoders, so naming it here
# costs the build nothing and the lock file no entry; see `crate::save` for why a save is
# compressed and why the reader still accepts plain JSON.
flate2 = "1.1"
nalgebra = "0.35.0"
# The native Save and Load dialogs, used through their synchronous API on the UI thread. A modal
# dialog blocking the frame is the behaviour wanted rather than a cost paid: the run cannot move
# under the user while they are choosing a file. See `SpacetimeApp::run_file_request`.
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` is not optional for this crate. Without it serde_json's parser takes a fast
# path that can land an ulp away from the decimal it was given, and a restored run has to be the
# same run to the bit: see `crate::save::v1::Num`.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Tests are numerics: long f64 integrations of geodesics and null rays, with no I/O and no waiting
# on anything. Unoptimised they run at a small fraction of speed, and the whole suite took nearly
# ten minutes of pure arithmetic. Optimising the test build changes nothing about what is checked -
# `debug-assertions` and `overflow-checks` stay on, so every `debug_assert!` and every arithmetic
# trap still fires - it only stops the checking being done at interpreter pace.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true

# An optional release build with fat LTO and one codegen unit: `cargo build --profile fat-lto`,
# which lands in target/fat-lto. It lets the optimiser inline across every crate boundary, egui's
# included, and measured 2026-09-24 it paints 7-10% faster (a frame 3-5%) while the simulation
# does not move. The physics is unchanged to the bit - rustc never contracts a multiply-add into
# an FMA or reorders floating-point arithmetic, and the perf fingerprints match. It is not the
# plain release profile because it costs about two and a half minutes a build against eight
# seconds, which every `cargo perf-check` after an edit would pay.
[profile.fat-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
