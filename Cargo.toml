[package]
name = "black-hole-lab"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
# gzip for the save format. Already in the tree behind eframe's image decoders, so naming it here
# costs the build nothing and the lock file no entry; see `crate::save` for why a save is
# compressed and why the reader still accepts plain JSON.
flate2 = "1.1"
nalgebra = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` is not optional for this crate. Without it serde_json's parser takes a fast
# path that can land an ulp away from the decimal it was given, and a restored run has to be the
# same run to the bit: see `crate::save::v1::Num`.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Tests are numerics: long f64 integrations of geodesics and null rays, with no I/O and no waiting
# on anything. Unoptimised they run at a small fraction of speed, and the whole suite took nearly
# ten minutes of pure arithmetic. Optimising the test build changes nothing about what is checked -
# `debug-assertions` and `overflow-checks` stay on, so every `debug_assert!` and every arithmetic
# trap still fires - it only stops the checking being done at interpreter pace.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
