# Builds Black Hole Lab for Windows, Linux and macOS, and on a version tag attaches the three
# archives to a draft GitHub release, to be checked and published by hand.
#
# Triggers:
#   - a pushed tag such as v0.1.312. The tag must name the version the build stamps into the
#     title, MAJOR.MINOR from Cargo.toml and the number of commits up to the tagged one as the
#     third segment (build.rs, src/version/compose.rs); the check job refuses any other.
#   - workflow_dispatch, run by hand from the Actions tab: builds the three archives and keeps
#     them as workflow artifacts, with no version check and no release.
#
# Each archive is one folder: the app; sky-look, sky-trace and sky-render beside it, where the
# app's Look Around looks for sky-look first; a maps folder with fetch-sky.ps1 and the checksums,
# for a user who fetches a map by hand; the demo saves; the licence and notices. The star map and
# ffmpeg are not shipped: Look Around's dialog downloads the one into the user's own data folder
# and gives the command that installs the other.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag against the version a build of the tagged commit would stamp. Skipped for a run by
  # hand, which has no tag to check.
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare the tag with the stamped version
        shell: bash
        run: |
          package=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          major_minor=$(echo "$package" | cut -d. -f1-2)
          count=$(git rev-list --count HEAD)
          stamped="$major_minor.$count"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, stamped version $stamped"
          if [ "$tag" != "$stamped" ]; then
            echo "::error::The tag v$tag does not match the version this commit stamps, $stamped. Tag this commit v$stamped instead."
            exit 1
          fi

  build:
    needs: check-version
    # Runs after a version check that passed, or with none at all on a run by hand.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            exe: .exe
          # The oldest supported Ubuntu runner, so that the binary asks for the oldest glibc and
          # runs on more distributions.
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: ''
          - os: macos-14
            platform: macos-aarch64
            exe: ''
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history: build.rs counts the commits for the version's third segment, and a
      # shallow clone counts one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sky -> sky/target

      - name: Install the Linux libraries eframe builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev

      # The app's build script builds the sky workspace into sky/target/release as well.
      - name: Build
        run: cargo build --profile fat-lto

      - name: Package
        shell: bash
        run: |
          package=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          version="$(echo "$package" | cut -d. -f1-2).$(git rev-list --count HEAD)"
          name="black-hole-lab-v$version-${{ matrix.platform }}"
          dir="dist/$name"
          mkdir -p "$dir/maps" "$dir/demos"
          cp "target/fat-lto/black-hole-lab${{ matrix.exe }}" "$dir/"
          for tool in sky-look sky-trace sky-render; do
            cp "sky/target/release/$tool${{ matrix.exe }}" "$dir/"
          done
          cp sky/maps/fetch-sky.ps1 sky/maps/checksums.sha256 sky/maps/README.md "$dir/maps/"
          cp demos/*.bhl "$dir/demos/"
          cp README.md LICENSE.TXT THIRD-PARTY-NOTICES.md "$dir/"
          cp sky/THIRD-PARTY-NOTICES.md "$dir/THIRD-PARTY-NOTICES-sky-tools.md"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      # Uploaded as the archive itself rather than zipped again: the artifact is the file, named
      # as the file is, and a download is the .zip or .tar.gz with nothing round it. The
      # .tar.gz is what keeps the programs executable on Linux and macOS, which a zip made by
      # the artifact store would not.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # A draft release with the three archives, for a tag only. Draft, so that nothing is public
  # until it has been looked at and published by hand.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Black Hole Lab for Windows (x86-64), Linux (x86-64) and macOS (Apple silicon).

          Extract the archive and keep every file together: the sky tools beside the app are
          what Look Around runs. Look Around also needs NASA's star map and ffmpeg. On the first
          press, Black Hole Lab offers to download the star map (153 MB) and shows the command
          that installs ffmpeg.

          **macOS:** this build is not signed. If macOS refuses to open the app, run this once
          in Terminal, in the folder you extracted:

              xattr -dr com.apple.quarantine .
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Black Hole Lab $GITHUB_REF_NAME" \
            --notes-file notes.md
