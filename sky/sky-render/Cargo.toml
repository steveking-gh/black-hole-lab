[package]
name = "sky-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Renders a sky bundle over a star map into a 360-degree AV1 video"
publish = false

[dependencies]
sky-format = { path = "../sky-format" }
# What shifted starlight looks like to an eye (`--colour blackbody`): a crate of this workspace,
# with no dependencies of its own, so the tree gains nothing.
sky-colour = { path = "../sky-colour" }
# The OpenEXR reader for NASA's star maps (half-float B, G, R, ZIP-compressed scanlines). `image`
# is already in the tree, but built without its EXR decoder, which is this crate anyway. Default
# features off: they add `rayon-core` for parallel decompression, and a map is read once per run.
# Pinned to 1.74.0 because 1.74.2 depends on `pulp` (SIMD, with five crates of its own), which a
# one-off read of a map does not need; with this pin the tree gains exactly four crates (exr, lebe,
# bit_field, zune-inflate) and reuses the half, smallvec and miniz_oxide it already has.
exr = { version = "=1.74.0", default-features = false }
# Writes the 16-bit PNG masters of `--keep-frames`. The version the GUI toolkit already brings, so
# the lock file gains no entry.
png = "0.18"
# Writes the read-outs' numbers exactly as the app does: the same decimal mark setting, the same
# names for NaN and infinity.
readout = { path = "../../crates/readout" }
# Rasterises the app's typefaces for the read-outs. Already in the lock file (the Wayland window
# decorations of the GUI toolkit use it), at the version given, so the tree gains no crate.
ab_glyph = "0.2.32"
jpeg-encoder = "0.7"
