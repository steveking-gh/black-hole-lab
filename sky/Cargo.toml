# The sky pipeline: everything that turns an observer's view near a black hole into a 360-degree
# video. It is a workspace of its own, beside Black Hole Lab's and not inside it, so that nothing
# here can change the app: not its manifest, not its lock file, not which features its dependencies
# are built with, not what `cargo run` or `cargo test` mean at the repository root. The app's
# workspace does not list these crates and these crates do not list the app.
#
# The one direction that is wanted is arranged another way: every build of the app runs
# `cargo build --release` here first, from the app's build script (`../build.rs`, `build_sky`),
# whenever a source under a crate of this workspace has changed. So `cargo run --release` at the
# root runs the app with sky tools as fresh as itself, and a crate here that does not compile fails
# the app's build. `cargo test` at the root still tests only the app; run it here for these crates.
#
# It was not always so. The first three crates were members of the app's workspace for a day, and
# two more binaries among its default members left `cargo run` unable to choose one, which broke
# the app's `cargo perf-check` and `cargo perf-baseline` aliases. A binary crate does not go into
# the app's workspace.
#
# What is shared is read-only: the geometry core and the number formatter in ../crates are path
# dependencies of crates here, built into this workspace's own target directory.
#
# Run cargo from this directory: `cargo test` here tests every crate of the pipeline.
#
# NEVER run `cargo fmt --all` here. `--all` follows path dependencies, so it reformats
# ../crates/kerr-equatorial and ../crates/readout, and through their workspace the app's own
# source: forty-one files of the app, the one time it was done. Format one crate at a time, with
# `cargo fmt -p <crate>`, or every crate of this workspace and nothing else with
#
#     cargo fmt -p sky-format -p sky-testgen -p sky-render -p kerr-sky -p sky-trace -p sky-colour -p sky-look
[workspace]
resolver = "3"
members = ["sky-format", "sky-testgen", "sky-render", "kerr-sky", "sky-trace", "sky-colour", "sky-look"]
